<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf6f4">
  <meta name="robots" content="noindex">
  <title>N&amp;N Nail · Yönetim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="admin">
  <section class="login hidden" id="login">
    <form class="card" id="login-form">
      <h1 class="logo">N<span>&amp;</span>N Nail</h1>
      <p class="muted">Yönetim paneli</p>
      <div class="field" style="text-align:left"><label for="pw">Şifre</label><input class="input" id="pw" type="password" autocomplete="current-password" required></div>
      <button class="btn block" type="submit">Giriş yap</button>
      <p class="muted small hidden" id="demo-hint" style="margin:14px 0 0"></p>
    </form>
  </section>

  <div id="app" class="hidden">
    <header class="topbar">
      <div class="topbar-inner"><h1>N<span>&amp;</span>N <span style="color:var(--ink)" id="page-title">Takvim</span></h1>
        <a class="icon-btn" href="/" target="_blank" title="Müşteri sitesini aç" aria-label="Müşteri sitesini aç">↗</a></div>
      <div class="sub" id="sub"></div>
    </header>
    <main class="page" id="page"></main>
    <nav class="tabbar" id="tabbar">
      <button data-tab="calendar" class="on"><i>🗓️</i>Takvim</button>
      <button data-tab="days"><i>✅</i>Günler</button>
      <button data-tab="services"><i>💅</i>Hizmetler</button>
      <button data-tab="staff"><i>👩</i>Personel</button>
      <button data-tab="settings"><i>⚙️</i>Ayarlar</button>
    </nav>
  </div>

  <dialog class="sheet" id="sheet">
    <div class="sheet-head"><h3 id="sheet-title"></h3><button class="icon-btn" type="button" data-close aria-label="Kapat">✕</button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="/admin.js"></script>
</body>
</html>
